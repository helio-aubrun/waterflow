openapi: "2.0"
info:
  title: "HWP — API MLOps Qualité de l'Eau"
  description: |
    Plateforme MLOps pour la classification de la potabilité de l'eau.

    ## Authentification

    **Clients (collectivités)** : header `X-API-Key: <votre_clé>`
    ou paramètre `?api_key=<votre_clé>`

    **Experts (analystes / exploit)** : header `Authorization: Bearer <token>`

    Les tokens experts sont configurés côté serveur via la variable d'environnement
    `EXPERT_TOKENS` au format `login:token:role,login2:token2:role2`.

    Rôles experts disponibles : `analyste`, `exploit` (super-rôle qui inclut analyste).
  version: "2.0.0"
  contact:
    name: "HWP — La Plateforme B3IA"

host: "localhost:8080"
basePath: "/"
schemes:
  - http
  - https

consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  ApiKeyHeader:
    type: apiKey
    in: header
    name: X-API-Key
  BearerToken:
    type: apiKey
    in: header
    name: Authorization
    description: "Format : Bearer <token>"

tags:
  - name: Public
    description: Routes sans authentification
  - name: Client
    description: Routes accessibles avec une clé API client
  - name: Ingestion
    description: Dépôt de prélèvements (manuel ou OCR)
  - name: Admin
    description: Gestion des comptes clients (tout expert)
  - name: Analyste
    description: Consultation globale et dashboards (rôle analyste+)
  - name: Exploitation
    description: Monitoring système (rôle exploit uniquement)

paths:

  # ── PUBLIC ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Public]
      summary: Santé du service
      description: Retourne l'état du service, la version du modèle et l'horodatage.
      responses:
        200:
          description: Service opérationnel
          schema:
            type: object
            properties:
              status:
                type: string
                example: "ok"
              model:
                type: string
                example: "models:/WaterQualityXGBoost/1"
              ts:
                type: string
                format: date-time

  # ── CLIENT ──────────────────────────────────────────────────────────────────

  /me:
    get:
      tags: [Client]
      summary: Profil du client authentifié
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Profil client
          schema:
            $ref: "#/definitions/ClientProfile"
        401:
          $ref: "#/responses/Unauthorized"

  /me/prelevements:
    get:
      tags: [Client]
      summary: Mes prélèvements (paginés)
      security:
        - ApiKeyHeader: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: date_debut
          in: query
          type: string
          format: date
          description: Filtre date début (YYYY-MM-DD)
        - name: date_fin
          in: query
          type: string
          format: date
          description: Filtre date fin (YYYY-MM-DD)
      responses:
        200:
          description: Liste paginée de prélèvements
          schema:
            $ref: "#/definitions/PaginatedPrelevements"
        401:
          $ref: "#/responses/Unauthorized"

  /me/prelevements/{id}:
    get:
      tags: [Client]
      summary: Détail d'un prélèvement
      security:
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Détail du prélèvement avec mesures et prédiction
          schema:
            $ref: "#/definitions/Prelevement"
        403:
          $ref: "#/responses/Forbidden"
        404:
          $ref: "#/responses/NotFound"

  /me/resultats:
    get:
      tags: [Client]
      summary: Mes résultats de prédiction
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Liste des prédictions du client
          schema:
            type: object

  /me/rgpd:
    get:
      tags: [Client]
      summary: Données personnelles (droit d'accès RGPD)
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Profil complet + historique d'accès + règles de conservation
    delete:
      tags: [Client]
      summary: Droit à l'effacement (RGPD)
      description: Anonymise le compte de façon irréversible.
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Compte anonymisé
        401:
          $ref: "#/responses/Unauthorized"

  /predict:
    post:
      tags: [Client]
      summary: Prédiction directe à partir de mesures, sans stockage
      description: |
        Calcule une prédiction de potabilité à partir de mesures fournies
        directement dans le corps de la requête, sans créer de prélèvement
        en base (contrairement à `/ingest/manual`). Utile pour un test rapide
        ou une intégration ne nécessitant pas de traçabilité en base.
      security:
        - ApiKeyHeader: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/Mesures"
      responses:
        200:
          description: Prédiction calculée
          schema:
            $ref: "#/definitions/PredictResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"

  # ── INGESTION ────────────────────────────────────────────────────────────────

  /ingest/manual:
    post:
      tags: [Ingestion]
      summary: Déposer des mesures JSON et obtenir une prédiction
      security:
        - ApiKeyHeader: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ManualIngestRequest"
      responses:
        201:
          description: Prélèvement créé et prédiction retournée
          schema:
            $ref: "#/definitions/IngestResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"
        422:
          description: Mesures invalides ou incomplètes

  /ingest/ocr:
    post:
      tags: [Ingestion]
      summary: Déposer une fiche labo (OCR uniquement, sans prédiction)
      description: |
        Accepte un fichier image (JPEG, PNG, WEBP, GIF) ou PDF (max 20 Mo).
        Extrait les données via OCR.space (primaire) ou Claude Vision (fallback).
        Crée un prélèvement structuré même si certaines mesures manquent.
      security:
        - ApiKeyHeader: []
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          type: file
          required: true
          description: Fiche de laboratoire (image ou PDF)
      responses:
        201:
          description: Prélèvement créé depuis OCR
          schema:
            $ref: "#/definitions/OcrResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"
        422:
          description: Fichier illisible ou type non supporté

  /ingest/ocr-and-predict:
    post:
      tags: [Ingestion]
      summary: Pipeline complet — OCR + prédiction en un appel
      description: |
        Enchaîne l'extraction OCR et la prédiction ML.
        Si des mesures sont manquantes après OCR, `prediction_possible` sera `false`
        et le prélèvement est quand même sauvegardé.
      security:
        - ApiKeyHeader: []
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          type: file
          required: true
      responses:
        201:
          description: Prélèvement + prédiction (si possible)
          schema:
            $ref: "#/definitions/OcrPredictResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"

  # ── ADMIN ────────────────────────────────────────────────────────────────────

  /admin/clients:
    get:
      tags: [Admin]
      summary: Lister tous les clients
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Liste paginée des clients
        401:
          $ref: "#/responses/Unauthorized"
    post:
      tags: [Admin]
      summary: Créer un compte client
      security:
        - BearerToken: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CreateClientRequest"
      responses:
        201:
          description: Client créé (sans clé API — générer via /apikey)
          schema:
            $ref: "#/definitions/ClientProfile"
        400:
          $ref: "#/responses/BadRequest"
        409:
          description: id_client déjà existant

  /admin/clients/{id}:
    get:
      tags: [Admin]
      summary: Détail d'un client
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: UUID ou id_client métier
      responses:
        200:
          description: Détail client
        404:
          $ref: "#/responses/NotFound"
    put:
      tags: [Admin]
      summary: Modifier denomination / adresse / statut actif
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          schema:
            $ref: "#/definitions/UpdateClientRequest"
      responses:
        200:
          description: Client mis à jour
        404:
          $ref: "#/responses/NotFound"

  /admin/clients/{id}/apikey:
    post:
      tags: [Admin]
      summary: Générer ou régénérer la clé API d'un client
      description: |
        La clé brute est retournée **une seule fois** dans la réponse.
        Elle n'est jamais stockée en clair. L'ancienne clé est immédiatement révoquée.
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: Nouvelle clé API générée
          schema:
            type: object
            properties:
              api_key:
                type: string
                example: "wf2_xK9mP..."
              hint:
                type: string
                example: "wf2_"
              generated_at:
                type: string
                format: date-time
        404:
          $ref: "#/responses/NotFound"

  # ── ANALYSTE ─────────────────────────────────────────────────────────────────

  /analyste/prelevements:
    get:
      tags: [Analyste]
      summary: Tous les prélèvements (filtrables, paginés)
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: client_id
          in: query
          type: string
        - name: source
          in: query
          type: string
          enum: [manual, ocr, api]
        - name: date_debut
          in: query
          type: string
          format: date
        - name: date_fin
          in: query
          type: string
          format: date
      responses:
        200:
          description: Liste paginée
          schema:
            $ref: "#/definitions/PaginatedPrelevements"
        401:
          $ref: "#/responses/Unauthorized"

  /analyste/prelevements/{id}:
    get:
      tags: [Analyste]
      summary: Détail complet d'un prélèvement (avec texte OCR brut)
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Prélèvement complet
        404:
          $ref: "#/responses/NotFound"

  /analyste/clients/{client_id}/prelevements:
    get:
      tags: [Analyste]
      summary: Prélèvements d'un client spécifique
      description: |
        Filtre les prélèvements par `id_client` métier (ex: `CLIENT-001`),
        pas par l'UUID interne. Réservé au rôle `analyste` (ou `exploit`).
      security:
        - BearerToken: []
      parameters:
        - name: client_id
          in: path
          required: true
          type: string
          description: id_client métier (ex CLIENT-001), pas l'UUID interne
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Liste paginée des prélèvements de ce client
          schema:
            $ref: "#/definitions/PaginatedPrelevements"
        401:
          $ref: "#/responses/Unauthorized"
        404:
          description: Client introuvable (id_client inconnu)
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Client 'CLIENT-999' introuvable."

  /analyste/dashboard:
    get:
      tags: [Analyste]
      summary: KPIs qualité agrégés
      description: |
        Retourne : total des prélèvements/prédictions, taux de potabilité,
        moyennes de 5 paramètres physico-chimiques, répartition par source
        d'ingestion (manual/ocr/api), 15 derniers prélèvements.
      security:
        - BearerToken: []
      responses:
        200:
          description: Dashboard agrégé
          schema:
            $ref: "#/definitions/DashboardResponse"

  # ── EXPLOITATION ──────────────────────────────────────────────────────────────

  /exploitation/metrics:
    get:
      tags: [Exploitation]
      summary: Métriques de performance (latence, volume, erreurs)
      description: |
        Paramètre optionnel `?limit=N` (défaut 5000, plafonné à 50000) :
        nombre de requêtes les plus récentes prises en compte pour le calcul.
      security:
        - BearerToken: []
      parameters:
        - name: limit
          in: query
          type: integer
          default: 5000
      responses:
        200:
          description: Métriques agrégées par route + indicateurs métier globaux
          schema:
            $ref: "#/definitions/MetricsResponse"
        401:
          $ref: "#/responses/Unauthorized"
        403:
          $ref: "#/responses/Forbidden"

  /exploitation/audit:
    get:
      tags: [Exploitation]
      summary: Journal d'accès RGPD
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 50
        - name: actor_type
          in: query
          type: string
          enum: [client, expert]
        - name: action
          in: query
          type: string
        - name: date_debut
          in: query
          type: string
          format: date
        - name: date_fin
          in: query
          type: string
          format: date
      responses:
        200:
          description: Journal paginé
        401:
          $ref: "#/responses/Unauthorized"
        403:
          $ref: "#/responses/Forbidden"

  /exploitation/monitoring:
    get:
      tags: [Exploitation]
      summary: Monitoring du modèle ML (data drift, dégradation, alertes)
      description: |
        Trois axes calculés sur une fenêtre glissante :
        - **Data drift** : indice PSI (Population Stability Index) par
          feature, comparé au jeu d'entraînement (`model_artifacts/training_stats.json`).
        - **Dégradation** : distribution des scores de confiance du modèle et
          taux de potabilité observé.
        - **Alertes** : déclenchées automatiquement selon des seuils PSI et
          de confiance (voir `thresholds` dans la réponse).
        Réservé au rôle `exploit` (pas accessible à `analyste`).
      security:
        - BearerToken: []
      parameters:
        - name: window_days
          in: query
          type: integer
          default: 30
          description: Fenêtre glissante en jours (plafonnée entre 1 et 365)
      responses:
        200:
          description: Rapport de monitoring complet
          schema:
            $ref: "#/definitions/MonitoringResponse"
        401:
          $ref: "#/responses/Unauthorized"
        403:
          $ref: "#/responses/Forbidden"

# ── DÉFINITIONS ──────────────────────────────────────────────────────────────────

definitions:

  Mesures:
    type: object
    required:
      - ph
      - Hardness
      - Solids
      - Chloramines
      - Sulfate
      - Conductivity
      - Organic_carbon
      - Trihalomethanes
      - Turbidity
    properties:
      ph:
        type: number
        example: 7.2
      Hardness:
        type: number
        example: 182.5
      Solids:
        type: number
        example: 18630.0
      Chloramines:
        type: number
        example: 8.1
      Sulfate:
        type: number
        example: 310.0
      Conductivity:
        type: number
        example: 415.0
      Organic_carbon:
        type: number
        example: 14.2
      Trihalomethanes:
        type: number
        example: 66.4
      Turbidity:
        type: number
        example: 3.8

  ManualIngestRequest:
    type: object
    required: [mesures]
    properties:
      mesures:
        $ref: "#/definitions/Mesures"
      date_prelevement:
        type: string
        format: date-time
        example: "2025-03-18T09:30:00"
      lieu:
        type: string
        example: "Station de pompage Nord"
      observations:
        type: string

  Prediction:
    type: object
    properties:
      potable:
        type: integer
        enum: [0, 1]
      label:
        type: string
        enum: ["Potable", "Non potable"]
      probability:
        type: number
        format: float
        example: 0.78
      model:
        type: string
        example: "models:/WaterQualityXGBoost/1"
      at:
        type: string
        format: date-time

  PredictResponse:
    type: object
    properties:
      potable:
        type: integer
        enum: [0, 1]
      label:
        type: string
        enum: ["Potable", "Non potable"]
      probability:
        type: number
        format: float
        example: 0.78

  DashboardResponse:
    type: object
    description: Reflete exactement api/routes/routes.py::analyste_dashboard()
    properties:
      total_prelevements:
        type: integer
      total_predictions:
        type: integer
      potable_count:
        type: integer
      non_potable_count:
        type: integer
      potable_rate:
        type: number
        format: float
        description: null si aucune prediction n'existe encore
      clients_actifs:
        type: integer
      sources:
        type: object
        description: "Comptage par source d'ingestion, ex: {manual: 3, ocr: 2}"
        additionalProperties:
          type: integer
      moyennes:
        type: object
        properties:
          ph:
            type: number
          turbidity:
            type: number
          conductivity:
            type: number
          chloramines:
            type: number
          hardness:
            type: number
      recents:
        type: array
        description: 15 derniers prelevements (toutes sources confondues)
        items:
          $ref: "#/definitions/Prelevement"

  DriftFeature:
    type: object
    description: Reflete exactement monitoring_service.py::compute_drift()
    properties:
      psi:
        type: number
        format: float
      level:
        type: string
        enum: [ok, warn, critical, insufficient_data]
      n_samples:
        type: integer
      prod_mean:
        type: number
        description: null si aucune mesure sur la fenetre
      train_mean:
        type: number
      mean_delta:
        type: number
        description: null si prod_mean est null

  MonitoringResponse:
    type: object
    description: Reflete exactement monitoring_service.py::full_report()
    properties:
      window_days:
        type: integer
      global_status:
        type: string
        enum: [ok, warn, critical]
      n_alerts:
        type: integer
      n_insufficient:
        type: integer
        description: Nombre de features en "insufficient_data" (pas assez d'echantillons pour un PSI fiable)
      alerts:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
              enum: [data_drift, confidence, potability_drift]
            severity:
              type: string
              enum: [warn, critical]
            feature:
              type: string
            message:
              type: string
            detail:
              type: string
            timestamp:
              type: string
              format: date-time
      drift:
        type: object
        description: "Cle = nom de feature (ph, Hardness, ...)"
        additionalProperties:
          $ref: "#/definitions/DriftFeature"
      confidence:
        type: object
        properties:
          n_predictions:
            type: integer
          status:
            type: string
            example: "no_data"
            description: present uniquement si n_predictions vaut 0
          avg_confidence:
            type: number
          pct_uncertain:
            type: number
          potability_rate:
            type: number
          confidence_level:
            type: string
            enum: [ok, warn]
      baseline:
        type: object
        properties:
          potability_rate:
            type: number
          n_train_samples:
            type: integer
      thresholds:
        type: object
        properties:
          psi_warn:
            type: number
          psi_ok:
            type: number
          min_samples_psi:
            type: integer
          confidence_warn:
            type: number
          potability_drift_warn:
            type: number

  MetricsResponse:
    type: object
    description: Reflete exactement api/routes/routes.py::exploitation_metrics()
    properties:
      routes:
        type: object
        description: "Cle = '<METHODE> <route>', ex: 'GET /health'"
        additionalProperties:
          type: object
          properties:
            count:
              type: integer
            errors:
              type: integer
            error_rate:
              type: number
              format: float
            p50_ms:
              type: number
            p95_ms:
              type: number
            avg_ms:
              type: number
      alerts:
        type: array
        description: Alertes systeme (taux d'erreur, latence p95) par route, vs `thresholds`
        items:
          type: object
          properties:
            type:
              type: string
              enum: [error_rate, latency]
            route:
              type: string
            severity:
              type: string
            message:
              type: string
            detail:
              type: string
      thresholds:
        type: object
        description: Seuils appliques pour generer `alerts`
        properties:
          error_rate_warn:
            type: number
            format: float
          p95_warn_ms:
            type: integer
      sample_size:
        type: integer
        description: Nombre de requetes prises en compte (borne par ?limit=)
      clients_total:
        type: integer
      clients_actifs:
        type: integer
      total_prelevements:
        type: integer
      total_predictions:
        type: integer
      potable_rate:
        type: number
        format: float
        description: null si aucune prediction n'existe encore

  Prelevement:
    type: object
    properties:
      id:
        type: string
        format: uuid
      client_id:
        type: string
        example: "CLIENT-001"
      date_prelevement:
        type: string
        format: date-time
      lieu:
        type: string
      source:
        type: string
        enum: [manual, ocr, api]
      observations:
        type: string
      mesures:
        $ref: "#/definitions/Mesures"
      prediction:
        $ref: "#/definitions/Prediction"
      warnings:
        type: array
        items:
          type: string

  PaginatedPrelevements:
    type: object
    properties:
      total:
        type: integer
      page:
        type: integer
      per_page:
        type: integer
      pages:
        type: integer
      items:
        type: array
        items:
          $ref: "#/definitions/Prelevement"

  IngestResponse:
    type: object
    properties:
      prelevement_id:
        type: string
        format: uuid
      prediction:
        $ref: "#/definitions/Prediction"

  OcrResponse:
    type: object
    properties:
      prelevement_id:
        type: string
        format: uuid
      prediction_possible:
        type: boolean
      extraction:
        type: object
      warnings:
        type: array
        items:
          type: string
      ocr_provider:
        type: string
        enum: [ocr_space, claude_vision]

  OcrPredictResponse:
    allOf:
      - $ref: "#/definitions/OcrResponse"
      - type: object
        properties:
          prediction:
            $ref: "#/definitions/Prediction"

  ClientProfile:
    type: object
    properties:
      id:
        type: string
        format: uuid
      id_client:
        type: string
        example: "CLIENT-001"
      denomination:
        type: string
        example: "Mairie de Marseille"
      adresse:
        type: string
      actif:
        type: boolean
      api_key_hint:
        type: string
        example: "wf2_"
      created_at:
        type: string
        format: date-time

  CreateClientRequest:
    type: object
    required: [id_client, denomination, adresse]
    properties:
      id_client:
        type: string
        example: "CLIENT-042"
      denomination:
        type: string
        example: "Commune de Toulon"
      adresse:
        type: string
        example: "Place de la Liberté, 83000 Toulon"

  UpdateClientRequest:
    type: object
    properties:
      denomination:
        type: string
      adresse:
        type: string
      actif:
        type: boolean

responses:
  Unauthorized:
    description: Clé API ou token manquant ou invalide
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Clé API invalide ou absente."
  Forbidden:
    description: Accès refusé (rôle insuffisant ou périmètre dépassé)
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Accès refusé."
  NotFound:
    description: Ressource introuvable
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Prélèvement introuvable."
  BadRequest:
    description: Requête invalide
    schema:
      type: object
      properties:
        error:
          type: string
